<html>
    <head>
        <title>Positioning</title>
        <style>
            #fixed{
                position: fixed;
                top:0;
                right:20px;
                width: 300px;
                border: 3px solid red;
            }
            #sticky{
                position: sticky;
                top:1px;
                width: 100px;
                border: 3px solid lime;
            }
            #relative{
                position:relative;
                left:100px;
                width: 100px;
                border: 3px solid green;
            }
            #abs{
                position:absolute;
                left:100px;
                width: 100px;
                border: 3px solid yellow;
            }

        </style>
    </head>
    <body>
        <h2>Positioning</h2>

        <div id="relative">
            Relative</div>
        <div id="abs">Absolute</div>
        
        <div id="fixed">Fixed</div>
        <div id="sticky">Sticky</div>
    </div>
    </body>
</html>
