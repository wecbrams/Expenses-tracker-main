<html>
    <head>
        <title>Links, tables and list</title>
    </head>
    <body>
        <a href="www.codingal.com">Codingal</a> <br>
        <a href="../l2 elements/1.html">click me</a>

        <h1>Tables</h1>
        <table border="5">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Grade</th>
                <th>Score</th>
            </tr>
            <tr>
                <td>Joshua</td>
                <td>10</td>
                <td>M</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Ali</td>
                <td>15</td>
                <td>F</td>
                <td>12</td>
            </tr>
        </table>

        <h1>LISTS</h1>
        <h2>Ordered list</h2>
        <ol>
            <li>Apple</li>
            <li>Banana</li>
            <li>Pawpaw</li>
        </ol>
        <ol type="I">
            <li>Apple</li>
            <li>Banana</li>
            <li>Pawpaw</li>
        </ol>
        <h2>Unorderd list</h2>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Pawpaw</li>
        </ul>
        <h2>Description List</h2>
        <dl>
            <dt>Coffee</dt>
            <dd>Black</dd>
            <dd>White</dd>

            <dt>milk</dt>
            <dd>Hot</dd>
            <dd>Cold</dd>
        </dl>
    </body>
</html>
