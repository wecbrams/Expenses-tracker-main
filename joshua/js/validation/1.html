<html>
    <head>
        <title>Validation in JS</title>
    </head>
    <body>
        <h1>Form validation</h1>
        <form name="myForm" onsubmit="return validateForm()">
            <label>Enter Name:</label>
            <input type="text" name="fname">
            <button type="submit">Submit name</button>
            <p id="nameMessage" class="message"></p>
        </form>

        <h1>Number Check</h1>
        <label>Enter a number (100-500):</label>
        <input type="number" id="id1" min="100" max="500" required>
        <button type="submit" onclick="checkNumber()">Check Number</button>
        <p id="result"></p>

        <script>
            function validateForm(){
                var x = document.forms['myForm']['fname'].value;
                if(x==''){
                    document.getElementById("nameMessage").innerHTML="Name must be filled out!"
                    return false
                }
                else{
                    document.getElementById("nameMessage").innerHTML="Name Submitted successfully!"

                }
            }

            function checkNumber(){
                var inputObj=document.getElementById('id1')
                if(!inputObj.checkValidity()){
                    document.getElementById('result').innerHTML=inputObj.validationMessage

                }
                else{
                    document.getElementById('result').innerHTML="Input OKAY"
                }
            }
        </script>
    </body>
</html>
