<html>
    <head>
        <title>Typography</title>
        <style>
            .tt{
                color: red;
                font-size: 30px;
                box-shadow: 4px 2px 2px lightcoral;
            }
            .t{
                color: blueviolet;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }

            div{
                width: 200px;
                height: 100px;
                background-color: lightblue;
                border: 1px solid red;
            }
            .is{
                transform: rotateX(180deg);
            }
            h1{
                text-shadow: 2px 3px 1px darkblue;
            }
        </style>
    </head>
    <body>
        <h1>Typography</h1>
        <p class="tt">Welcome to codingal</p>
        <p class="t">Welcome to codingal</p>

        <div>Codingal</div>
        <div class="is">Codingal</div>

    </body>
</html>
