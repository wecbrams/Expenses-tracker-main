<html>
    <head>
        <title>NAvbar</title>
        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .topnav{
                overflow: hidden;
                background-color: blue;
            }
            .topnav a{
                float:left;
                color: aquamarine;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;

            }
            .topnav a:hover{
                background-color: brown;
                color: aqua;
            }
            .topnav a.active{
                background-color: purple;
                color: black;
            }
        </style>
    </head>

    <body>
        <div class="topnav">
            <a href="#home" class="active">Home</a>
            <a href="#">About Us</a>
            <a href="#">Gallery</a>
            <a href="#">Contact US</a>
        </div>
    </body>
</html>
