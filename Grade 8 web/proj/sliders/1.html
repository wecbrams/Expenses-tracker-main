<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Slideshow</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#111;
}

.slideshow-container{
    max-width:900px;
    position:relative;
    margin:auto;
}

/* Hide slides by default */
.mySlides{
    display:none;
}

/* Images */
.mySlides img{
    width:100%;
    height:500px;
    object-fit:cover;
    border-radius:8px;
}

/* Caption text */
.text{
    color:#fff;
    font-size:24px;
    padding:12px 16px;
    position:absolute;
    bottom:20px;
    left:20px;
    background:rgba(0,0,0,0.5);
    border-radius:5px;
}

/* Navigation arrows */
.prev, .next{
    cursor:pointer;
    position:absolute;
    top:50%;
    padding:16px;
    color:white;
    font-weight:bold;
    font-size:22px;
    transition:0.3s;
    border-radius:3px;
    user-select:none;
}

.prev{
    left:0;
}

.next{
    right:0;
}

.prev:hover, .next:hover{
    background:rgba(0,0,0,0.6);
}

/* Dots */
.dots{
    text-align:center;
    margin-top:15px;
}

.dot{
    cursor:pointer;
    height:15px;
    width:15px;
    margin:0 4px;
    background:#bbb;
    border-radius:50%;
    display:inline-block;
    transition:0.3s;
}

.active, .dot:hover{
    background:#717171;
}

/* Fade animation */
.fade{
    animation:fade 1s;
}

@keyframes fade{
    from{opacity:.4}
    to{opacity:1}
}

</style>
</head>

<body>

<div class="slideshow-container">

<div class="mySlides fade">
<img src="pic1.jpg">
<div class="text">Beautiful Nature</div>
</div>

<div class="mySlides fade">
<img src="pic2.jpg">
<div class="text">Explore the World</div>
</div>

<div class="mySlides fade">
<img src="pic3.jpg">
<div class="text">Adventure Awaits</div>
</div>

<a class="prev" onclick="plusSlides(-1)">❮</a>
<a class="next" onclick="plusSlides(1)">❯</a>

</div>

<div class="dots">
<span class="dot" onclick="currentSlide(1)"></span>
<span class="dot" onclick="currentSlide(2)"></span>
<span class="dot" onclick="currentSlide(3)"></span>
</div>

<script>

let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n){
    showSlides(slideIndex += n);
}

function currentSlide(n){
    showSlides(slideIndex = n);
}

function showSlides(n){

let i;
let slides = document.getElementsByClassName("mySlides");
let dots = document.getElementsByClassName("dot");

if(n > slides.length){slideIndex = 1}
if(n < 1){slideIndex = slides.length}

for(i = 0; i < slides.length; i++){
slides[i].style.display = "none";
}

for(i = 0; i < dots.length; i++){
dots[i].className = dots[i].className.replace(" active","");
}

slides[slideIndex-1].style.display = "block";
dots[slideIndex-1].className += " active";

}

/* Auto Slide */
setInterval(()=>{
plusSlides(1);
},3000);

</script>

</body>
</html>
