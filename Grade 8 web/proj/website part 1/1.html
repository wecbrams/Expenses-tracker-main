<html>
    <head>
        <title>My Website</title>
            <style>
                body {
                    margin: 0;
                    font-family: Georgia, 'Times New Roman', Times, serif;
                    background: lightgray;
                }
            
                .topnav {
                    background: linear-gradient(90deg, black, darkgray);
                    overflow: hidden;
                    padding: 5px 0;
                    box-shadow: 0 4px 10px black;
                }
            
                a {
                    float: left;
                    color: white;
                    text-align: center;
                    padding: 16px 22px;
                    text-decoration: none;
                    font-size: 18px;
                    letter-spacing: 1px;
                    transition: 0.3s;
                }
            
                a:hover {
                    background-color:gold;
                    color: darkgray;
                    transform: scale(1.05);
                    font-weight: bold;
                }
            
                a.active {
                    background-color: greenyellow;
                    color: black;
                    font-weight: bold;
                }
            
                .slideshow-container {
                    width: 100%;
                    max-height: 500px;
                    position: relative;
                    margin-top: 0;
                }
            
                .mySlides {
                    width: 100%;
                    display: none;
                    object-fit: cover;
                    height: 500px;
                    border-bottom: 6px solid yellow;
                }
            
                .fade {
                    animation: fadeEffect 1.5s;
                }
            
                @keyframes fadeEffect {
                    from {
                        opacity: 0.4;
                    }
            
                    to {
                        opacity: 1;
                    }
                }
            </style>

    </head>
    <body>
        <div class="topnav">
            <a href="#" class="active">Home</a>
            <a href="#">About Us</a>
            <a href="#">Gallery</a>
            <a href="#">Contact Us</a>
        </div>
        <div class="slideshow-container">
            <img src="" alt="Slide 1" class="myslides fade">
            <img src="" alt="Slide 2" class="myslides fade">
            <img src="" alt="Slide 3" class="myslides fade">
        </div>
        <script>
            let myIndex = 0;
                carousel();
                function carousel() {
                    let i;
                    let x = document.getElementsByClassName("mySlides");
                    for (i = 0; i < x.length; i++) {
                        x[i].style.display = "none";
                    }
                    myIndex++;

                    if (myIndex > x.length) {
                        myIndex = 1;
                    }
                    x[myIndex - 1].style.display = "block";

                    setTimeout(carousel, 3000);
                }
        </script>
    </body>
</html>
