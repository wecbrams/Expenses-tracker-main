<html>
    <head>
        <title>Background Effect</title>
        <style>
            body{
                background-color: green;
                background-image: url("m.png");
                background-repeat: round;
                background-repeat: no-repeat;
                background-position: right top;
                background-attachment: fixed;
                background-attachment: scroll;
            }
            .l{
                height:200px;
                width: 200px;
                background: linear-gradient(red,yellow,purple);
            }
            .r{
                height:200px;
                width: 200px;
                background: linear-gradient(to right, red,yellow,purple);
            }
            .t{
                height:200px;
                width: 200px;
                background: radial-gradient( red,yellow,purple);
            }
        </style>
    </head>
    <body>
        <div class="l"></div> <br>
        <div class="r"></div> <br>
        <div class="t"></div>
        Background effect
    </body>
</html>
