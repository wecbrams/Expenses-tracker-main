<html>
    <head>
        <title>Text Styling </title>
        <style>
            .t1{
                color:blueviolet;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            .t2{
                font-size: 30px;
            }
            #i{
                transform: rotate(200deg);
            }
            h2{
                text-decoration: overline;
                text-transform: capitalize;
            }
            h3{
                text-decoration: line-through;
                text-transform: uppercase;

            }
            h4{
                text-decoration: underline;
                text-transform: lowercase;
            }
            h5{
                text-transform: none;
                text-decoration: overline underline;
            }
            .u{
                text-shadow: 2px 2px 1px lightblue;
                box-shadow: 5px 6px 5px red;
                text-indent: 50px;
            }
        </style>
    </head>
    <body>
        <h1 class="u">Shadow</h1>
       <h1 id="i">Typography</h1>
        <p class="t1">Welcome to codingal</p>
        <p class="t2">Welcome to codingal</p> 

        <h1>Text Decoration and Transformation</h1>
        <h2>codingal</h2>
        <h3>codingal</h3>
        <h4>CODINGAL</h4>
        <h5>CODINGAL</h5>
    </body>
</html>
