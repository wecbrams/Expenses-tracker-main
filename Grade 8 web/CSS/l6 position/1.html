<html>
    <head>
        <title>Positioning in CSS</title>
        <style>
            div{
                right: 30px;
                border: 3px solid yellow;
            }
            .abs{
                position: absolute;
                left:50px;
                border: 3px solid blue;
            }
            #rel{
                position: relative;
                left: 100px;
                border: 3px solid aqua;
            }
            .fix{
                position: fixed;
                top:0;
                right: 20px;
                width: 300px;
                border: 3px solid brown;
            }

            .sticky{
                position: sticky;
                right: 20px;
                width: 300px;
                border: 3px solid purple;
                top: 5px;
            }
            h1{
                opacity: 0.1;
            }
            h2{
                opacity:50%;
            }
        </style>
    </head>
    <body>
        <h2>Positioning</h2>
        <div>Div without Positioning property</div>

        <div class="sticky">Sticky Positioning</div>
        <div id="rel">The Div with Relative Positioning
            <div class="abs">Absolute Positioning</div>
        </div>

        <div class="fix">Div with fixed positionong</div>

        <h1>Opacity 0.1</h1>
        <h2>Opacity 0.5</h2>
        <h3>Opacity 0.9</h3>
