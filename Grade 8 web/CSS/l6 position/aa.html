<html>
    <head>
        <title>Positioning in html</title>
        <style>
            div{
                right: 30px;
                border: 3px dotted red;
            }
            .absolute{
                position: absolute;
                left:50px;
                border: 3px solid red;
            }
            .relative{
                position: relative;
                left:100px;
                border: 3px solid green;
            }
            .fixed{
                position:fixed;
                top:0px;
                right: 20px;
                width: 200px;
                border: 3px solid yellow;
            }
            .sticky{
                position:sticky;
                top:2px;
                right: 20px;
                width: 200px;
                border: 3px solid yellow;
            }

            h2{
                opacity: 0.3;
            }
            h1{
                opacity: 60%;
            }

        </style>
    </head>
    <body>
        <h2>Opacity 1</h2>
        <h1>Opacity 2</h1>
        <h1>Positioning</h1>
        <div>Div with no position property</div>
        <div class="stick">Div with sticky position property</div>

        <div class="relative">
            Div with Relative position property
            <div class="absolute">Div with absolute position property</div>
        </div>
        <div class="fixed">Div with fixed position property</div>

        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
