<!DOCTYPE html>
<html lang="en">
<head>
   <title>Lists</title>
</head>
<body>
    <h1>Ordered</h1>
    <ol>
        <li>Apples</li>
        <li>Mangoes</li>
        <li>Grapes</li>
    </ol>

    <ol type="i">
        <li>Apples</li>
        <li>Mangoes</li>
        <li>Grapes</li>
    </ol>

    <h1>Unordered</h1>
    <ul>
        <li>Apples</li>
        <li>Mangoes</li>
        <li>Grapes</li>
    </ul>
    <ul type="square">
        <li>Apples</li>
        <li>Mangoes</li>
        <li>Grapes</li>
    </ul>
    <ul type="circle">
        <li>Apples</li>
        <li>Mangoes</li>
        <li>Grapes</li>
    </ul>

    <h1>Description list</h1>
    <dl>
        <dt>Milk</dt>
        <dd>Cold</dd>
        <dd>hot</dd>

        <dt>Coffee</dt>
        <dd>White</dd>
        <dd>black</dd>


    </dl>
</body>
</html>
