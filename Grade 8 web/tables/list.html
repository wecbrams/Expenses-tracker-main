<html>
<head>
    <title>Lists</title>
</head>
<body>
    <h1>Types of list</h1>
    <h2>1. Ordered</h2>
    <ol>
        <li>Melvin</li>
        <li>Abella</li>
        <li>Eric</li>
    </ol>
    <h2>2. unordered</h2>
    <ul>
        <li>Melvin</li>
        <li>Abella</li>
        <li>Eric</li>
    </ul>

    <h2>3. Description list</h2>
    <dl>
        <dt>Coffee</dt>
        <dd>Black</dd>
        <dd>White</dd>
        <dt>Milk</dt>
        <dd>Hot</dd>
        <dd>cold</dd>
    </dl>
</body>
</html>
