<html>
    <head>
        <title>Footer in HTML</title>
        <style>
            body, html{
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction:column;
            }
            .content{
                flex:1;
                padding: 20px;
            }
            .footer{
                position: fixed;
                left: 0;
                bottom: 0;
                width: 100%;
                background:linear-gradient(90deg,#ff4b1f,#1fddff);
                color: white;
                text-align: center;
                padding: 15px 10px;
                box-shadow: 0 -5px black;
                font-size: bold;
                overflow: hidden;
                
            }
            .footer{
                margin: 0;
                animation: glow 2s infinite alternate;

            }
            @keyframes glow {
                0%{text-shadow: 0 0 5px white,0 0 10px #fff ;}
                50%{text-shadow: 0 0 10px white,0 0 20px #fff, 0 0 30px #1fddff ;}
                100%{text-shadow: 0 0 5px white,0 0 10px #fff ;}
                
            }
            .footer:hover{
                background: linear-gradient(90deg, #1fddff, #ff4b1f);
                transition: background 0.5s ease;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <h1>Welcome to my website</h1>
            <p>This is a demi page showcase a beautiful footer</p>
        </div>
        <div class="footer">
            <p>&copy; All rights reserved by Ali</p>
        </div>
    </body>
</html>
