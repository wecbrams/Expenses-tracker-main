<html>
    <head>
        <title>Regular Expression</title>
    </head>
    <body>
        <p id="seR"></p>
        <p id="reR"></p>
        <p id="ST"></p>
        <script>
            var str="Hello how are doing for the day"
            var searchp=str.search('doing')
            var txt=str.replace("how are", "HOW ARE YOU")
            var x =70
            var y =90

            document.getElementById('seR').innerHTML=searchp
            document.getElementById('reR').innerHTML=txt
            document.getElementById('ST').innerHTML=String(x)+String(y)
        </script>
    </body>
</html>
