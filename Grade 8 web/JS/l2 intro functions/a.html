<html>
    <head>
        <title>Intro to functions</title>
    </head>
    <body>
        <button onclick="mu(5)">Click here</button>
        <p id="i"></p>
        <p id="ii"></p>

        <script>

            var b = 5  // global var
            function mu(x,y){
                if (y==undefined){
                    y=2
                }
                document.write(x*y)
                var a=7 // local   
            }
                document.getElementById('ii').innerHTML= b
                document.getElementById('i').innerHTML= a*b    

        </script>
    </body>
</html>
