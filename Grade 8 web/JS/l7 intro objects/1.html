<html>
    <head>
        <title>objects properties</title>
    </head>
    <body>
        <h1>2 ways of accessing properties</h1>
        <p id="d"></p>
        <script>
            var person ={firstname: "Joel", age:20}
            document.getElementById('d').innerHTML=person.firstname +
            " is " +person['age']+ " years old"

            var value = Math.random()
            document.write("Demo test value: "+value +"<br>")
            
            var value = Math.abs(20)
            document.write("Demo test value: "+value +"<br>")
         var value = Math.acos(-1)
            document.write("Demo test value: "+value +"<br>")
         var value = Math.asin(1)
            document.write("Demo test value: "+value +"<br>")
         var value = Math.atan(1)
            document.write("Demo test value: "+value +"<br>")
        
        </script>
    </body>
</html>
