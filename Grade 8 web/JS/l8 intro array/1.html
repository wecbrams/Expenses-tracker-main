<html>
    <head>
        <title>Arrays</title>
    </head>
    <body>
        <p id="d"></p>
        <p id="a"></p>
        <p id="b"></p>
        <p id="c"></p>
        <script>
            var fruits=['apples','mango','grapes','oranges']
            document.getElementById('d').innerHTML=fruits[3]
            document.getElementById('a').innerHTML=fruits.join(' * ')
            document.getElementById('b').innerHTML=fruits.pop()
            document.getElementById('c').innerHTML=fruits

        </script>
    </body>
</html>
