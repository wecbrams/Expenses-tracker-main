<html>
    <head>
        <title>Call stack</title>
    </head>
    <body>
        <p id="u"></p>
        <script>
            function add(a,b){
                return a + b
            }
            function average(a,b){
                return add(a,b)/2
            }
            let result = average(10,20)

            document.getElementById('u').innerHTML=result
        </script>
    </body>
</html>
