<html>
    <head>
        <title>Positioning</title>
        <style>
            div{
                border: 4px dotted red;
            }
            .rel{
                position: relative;
                left:70px;
                border: 3px solid yellowgreen;
                background-color: yellow;
            }
            .abs{
                position: absolute;
                left:40px;
                border:2px solid lime;
                background-color: blue;
                color:white;
            }
            .stick{
                position: sticky;
                top:10px;
                left:20px;
                width:100px;
                border:7px solid lime;
            }
            .fix{
                position: fixed;
                top:0;
                right:30px;
                width: 400px;
                border: 2px dotted yellow;
                background-color: purple;
            }
            h1{
                opacity: 1;
            }
            h2{
                opacity: 0.5;
            }
            h3{
                opacity: 20%;
            }

        </style>
    </head>
    <body>
        <h1>Positioning</h1>
        <div>Div with no Positioning</div>
        <div class="stick">Div with Sticky Positioning</div>
        <div class="rel">Div with Relative Positioning
            <div class="abs">Div with Absolute Positioning</div>
        </div>
        <div class="fix">Div with Fixed Positioning</div>
        <br><br><br><br>
        <h1>Opaque opacity</h1>
        <h2>Translucent</h2>
        <h3>Transparent</h3>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
