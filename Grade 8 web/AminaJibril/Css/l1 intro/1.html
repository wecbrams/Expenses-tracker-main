<html>
    <head>
        <title>Intro to html</title>
        <style>
            /* Element selector  */
            h5 {
                color: blue;
            }

            /* Id selector  */
            #testing {
                color: orange;
            }
            /* Class selector  */
            .te {
                color: purple;
            }
            *{
                background-color: cadetblue;
            }
            /* group selector  */
            h5,p{
                background-color: yellow;;
            }
        </style>
        <link rel="stylesheet" href="1.css">
    </head>
    <body>
        <p style="color:lime;">This is Inline CSS testing</p>

        <h5>Internal CSS</h5>
        <h4>External CSS</h4>
        <h5 id="testing">Id selector</h5>
        <h5 class="te">Class selector</h5>

    </body>
</html>
