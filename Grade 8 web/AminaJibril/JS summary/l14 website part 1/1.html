<html>
    <head>
        <title>Awesome website</title>
        <style>
            body{
            margin: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
            background: whitesmoke;
            }
            
            .topnav{
            background: linear-gradient(90deg, black, dimgray);
            overflow: hidden;
            padding: 5px 0;
            box-shadow: 0 4px 10px black;
            }
            
            a{
            float: left;
            color: white;
            text-align: center;
            padding: 16px 22px;
            text-decoration: none;
            font-size: 18px;
            letter-spacing: 1px;
            transition: 0.3s;
            }            
            a:hover{
            background-color: gold;
            color: black;
            transform: scale(1.05); /* FIXED */
            font-weight: bold;
            }           
            a.active{
            background-color: gold;
            color: black;
            font-weight: bold;
            }           
            .slideshow-container{
            width: 100%;
            max-height: 500px;
            position: relative;
            margin-top: 0;
            }
            
            .myslides{
            width: 100%;
            display: none;
            object-fit: cover;
            height: 500px;
            border-bottom: 6px solid gold;
            }
            
            .fade{
            animation: fadeEffect 1.5s;
            }
            
            @keyframes fadeEffect {
            from{opacity: 0.4;}
            to{opacity: 1;}
            }
            </style>
    </head>
    <body>
        <div class="topnav">
            <a href="#" class="active">Home</a>
            <a href="#">About Us</a>
            <a href="#">Gallery</a>
            <a href="#">Contact us</a>
        </div>
        <div class="slideshow-container">
            <img src="image copy 2.png" alt="" class="myslides fade">
            <img src="image copy.png" alt="" class="myslides fade">
            <img src="image.png" alt="" class="myslides fade">
        </div>
        <script>
            let myIndex =0
            carousel()
            function carousel(){
                let i
                let x=document.getElementsByName("myslides")

                for(i=0;i<x;i++){
                    x[i].style.display="none"
                }
                myIndex++
                if(myIndex>x.length){
                    myIndex=1
                }
                x[myIndex-1].style.display="block"
                setTimeout(carousel,3000)
            }
        </script>
    </body>
</html>
