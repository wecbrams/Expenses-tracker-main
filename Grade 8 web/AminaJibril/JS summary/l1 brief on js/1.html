<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h1, initial-scale=1.0">
    <title>Datatypes</title>
</head>
<body>
    <h1>Data Types</h1>
    <script>
        var a = 7
        var b= 9
        var c= 9
        var d = null
        var e     // undefined

        document.write("a and b are equal: "+ (a == b) +"<br>")
        document.write("b and c are equal: "+ (b == c) +"<br>")
        document.write("The value of d is: "+ d +"<br>")
        document.write("The value of e is: "+ e +"<br>")

        let i =0
        let text =""
        while (i<=10){
            text += "<br>The number is "+i
            i++
        }
        document.write(text)


    </script>
</body>
</html>
