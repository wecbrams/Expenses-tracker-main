<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h2, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Class inheritance</h2>
    <p>Use the <code>extends</code> keyword to inherit all 
        the methods from
    another class</p>
    <p>use the <code>super</code> methos to call the parent's constructor funtion</p>
    <p id="details"></p>
    <script>
        class Car{    // Parent class
            constructor(brand){
                this.carname = brand
            }
            present(){
                return "I have a "+ this.carname
            }
        }

        class Model extends Car{
            constructor(brand,mod){
                super(brand)
                this.model= mod
            }
            show(){
                return this.present()+", it is a " + this.model
            }
        }
        let myCar = new Model("Ford","Mustang")
        document.getElementById("details").innerHTML=myCar.show()
    </script>
</body>
</html>
