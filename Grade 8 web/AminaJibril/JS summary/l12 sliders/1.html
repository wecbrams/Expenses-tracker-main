<html>
    <head>
        <title>Sliders</title>
        <style>
        body{
        margin:0;
        font-family:sans-serif;
        background:black;
        color:lime;
        }
        .slideshow-container{
        max-width:800px;
        margin:auto;
        position:relative;
        }
        
        .mySlides{
        display:none;
        }
        
        .mySlides img{
        width:100%;
        border-radius:6px;
        }
        .text{
        position:absolute;
        bottom:15px;
        left:15px;
        background:rgba(0,0,0,0.5);
        padding:6px 12px;
        border-radius:4px;
        font-size:18px;
        }
        .prev,.next{
        position:absolute;
        top:50%;
        transform:translateY(-50%);
        font-size:24px;
        padding:10px;
        cursor:pointer;
        color:white;
        }
        .prev{
        left:10px;
        }
        
        .next{
        right:10px;
        }
        .dots{
        text-align:center;
        margin:12px;
        }
        .dot{
        height:12px;
        width:12px;
        background:#bbb;
        border-radius:50%;
        display:inline-block;
        margin:0 4px;
        cursor:pointer;
        }
        .active{
        background:white;
        }
    </style>
    </head>

        <script>
            let slideIndex=1
            showSlides(slideIndex)
            function plusSlides(n) {
                    showSlides(slideIndex += n)
                }
            function currentSlide(n){
                showSlides(slideIndex=n)
            }
            function showSlides(n){
                let i
                let slides=document.getElementsByClassName("mySlides")
                let dots = document.getElementsByClassName("dot")

                if(n>slides.length){slideIndex=1 }
                if (n<1) { slideIndex = slides.length }
                for(i=0; i<slides.length;i++){
                    slides[i].style.display="none"
                }
                for (i = 0; i < slides.length; i++) {
                    dots[i].className=dots[i].className.replace("Active","")
                }
                slides[slideIndex-1].style.display="block"
                dots[slideIndex-1].className+=" active"
            }
            setInterval(()=>{
                plusSlides(1)
            },3000)
