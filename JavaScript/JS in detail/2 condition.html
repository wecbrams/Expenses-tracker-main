<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Click for greetings</p>
    <button onclick="myf()">Try it</button>
    <p id="hr"></p>
    <p id="gr"></p>
    <script>
        function myf(){
            var greeting
            var time=new Date().getHours()

            if (time < 10){
                greeting="Good Morning"
            }
            else if (time < 20){
                greeting="Good day"
            }
            else{
                greeting="Good evening"
            }

            document.getElementById("hr").innerHTML="Current hour is : "+time
            document.getElementById("gr").innerHTML=greeting
        }
    </script>
</body>
</html>
