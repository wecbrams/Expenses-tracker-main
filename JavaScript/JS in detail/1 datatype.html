<!DOCTYPE html>
<html lang="en">
<head>
    <title>Data types</title>
</head>
<body>
    <h1>JS Data types</h1>
    <script>
        var a = 8
        var b = 10
        var c= 10
        var d =null
        var e
        var f = "Hola"
        document.write("a and b are equal : " + (a==b) + "<br>")
        document.write("b and c are equal : " + (c==b) + "<br>")
        document.write("The value of d is : "+d +"<br>")
        document.write("The value of e is : "+e)
        document.write("The dataType of f is : " + typeof(f))
    </script>
</body>
</html>
