<!DOCTYPE html>
<html lang="en">
<head>
       <title>Functions</title>
</head>
<body>
    <button onclick="mult(10,5)">Execute JS Function</button>
    <button onclick="add(10,5)">Execute JS Function</button>
    <button onclick="subt(10,5)">Execute JS Function</button>

    <script>
        function mult(a,b){
            if (b===undefined){
                b=2
            }
            document.write(a*b)
        }
        function add(a,b){
            if (b===undefined){
                b=2
            }
            document.write(a+b)
        }
        function subt(a,b){
            if (b===undefined){
                b=2
            }
            document.write(a-b)
        }
    </script>
</body>
</html>
