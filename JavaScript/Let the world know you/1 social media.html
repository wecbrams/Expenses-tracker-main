<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Baloo Tamma 2', cursive;
      background-color: #f8f9fa;
    }

    .social-section {
      background: linear-gradient(135deg, #212529, #343a40);
      padding: 80px 0;
    }

    .social-card {
      background-color: #212529;
      border-radius: 12px;
      padding: 25px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .social-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .social-icon {
      font-size: 2.2rem;
    }

    footer {
      background-color: #212529;
    }
  </style>
</head>
<body>

<!-- Social Media Section -->
<section class="social-section text-white text-center">
  <div class="container">
    <h2 class="text-warning fw-bold mb-3">Social Media</h2>
    <p class="lead mb-5">Let’s connect and grow together 🚀</p>

    <div class="row g-4">
      <!-- LinkedIn -->
      <div class="col-sm-6 col-lg-3">
        <div class="social-card d-flex justify-content-between align-items-center">
          <h5 class="mb-0">LinkedIn</h5>
          <i class="fab fa-linkedin social-icon text-warning"></i>
        </div>
      </div>

      <!-- YouTube -->
      <div class="col-sm-6 col-lg-3">
        <div class="social-card d-flex justify-content-between align-items-center">
          <h5 class="mb-0">YouTube</h5>
          <i class="fab fa-youtube social-icon text-danger"></i>
        </div>
      </div>

      <!-- Email -->
      <div class="col-sm-6 col-lg-3">
        <div class="social-card d-flex justify-content-between align-items-center bg-warning text-dark">
          <h5 class="mb-0">Email</h5>
          <i class="fas fa-envelope social-icon"></i>
        </div>
      </div>

      <!-- Twitter -->
      <div class="col-sm-6 col-lg-3">
        <div class="social-card d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Twitter</h5>
          <i class="fab fa-twitter social-icon text-info"></i>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="text-light text-center py-4">
  <div class="container">
    <p class="mb-1">&copy; 2026 Codingal Education. All Rights Reserved.</p>
    <a href="/about" class="text-warning text-decoration-none">About</a>
  </div>
</footer>

</body>
</html>
