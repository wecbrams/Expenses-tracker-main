<fieldset>

        <br><br>

        <input type="checkbox"> Grapes <br>

        <!-- <input type="submit" value="Register"> -->
         <button>Submit</button>

        </fieldset>
    </form>

    <select>

        <option >computer</option>
        <option >pen</option>
        <option >tablet</option>
    </select>
