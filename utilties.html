<!DOCTYPE html>
<html lang="en">
<head>
	<title>Bootstrap Jumbotron</title>
	
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
	
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>

<body style="text-align:center;">
	<div class="jumbotron ">
		<div class="container">
			<h1 style="color:orange;">Codingal</h1>	
            <p>Codingal will help you fall in love with coding.</p>
		</div>
	</div>
	
	<div class="container mt-3">
        <h2>Buttons</h2>
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-secondary">Secondary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-danger">Danger</button>
        <button type="button" class="btn btn-danger btn-sm">Small</button>
        <button type="button" class="btn btn-info btn-lg">Large</button>
        <button type="button" class="btn btn-danger btn-md ">Medium</button>
    </div>

    <hr>
    <div class="container">
        <h2>Contextual Badges</h2>
        <span class="badge badge-primary">Primary</span>
        <span class="badge badge-secondary">Secondary</span>
        <span class="badge badge-success">Success</span>
        <span class="badge badge-danger">Danger</span>
        <span class="badge badge-warning">Warning</span>
        <span class="badge badge-info">Info</span>
        <span class="badge badge-light">Light</span>
        <span class="badge badge-dark">Dark</span>
      </div>
      <h1>Attention! A
        <span class="badge badge-primary">NEW</span> Product on market</h1>
<h1>progress bar</h1>
<div class="container">
    <div class="progress">
        <div class="progress-bar" style="width: 30%;"></div>
    </div> <br>
    <div class="progress">
        <div class="progress-bar" style="width: 60%;"></div>
    </div> <br>
    <div class="progress">
        <div class="progress-bar" style="width: 80%;"></div>
    </div> <br>
</div>
</body>

</html>
