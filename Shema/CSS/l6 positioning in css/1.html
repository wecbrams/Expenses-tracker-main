
<html >
<head>
    <title>Positioning</title>
    <style>
        .sticky{
            position: sticky;
            top:30px;
            width: 150px;
            border: 3px solid lime;
            padding: 30px;
            background-color: yellow;
        }
        .rel{
            position: relative;
            left: 100px;
            border: 3px solid red;

        }
        .abs{
            position: absolute;
            border: 3px solid yellow;
            left: 50px;

        }
        .fix{
            position: fixed;
            top:0;
            border: 3px solid blue;
            left:300px;

        }
        h1{
            opacity: 100%;
        }
        h2{
            opacity: 0.5;
        }
        h3{
            opacity: 0;
        }
    </style>
</head>
<body>
    <h1>Positioning</h1>
    <div>Div with normal(Static) position</div>
    <div class="sticky">Div with sticky positioning</div>
    <div class="rel">Div with Relative positioning
        <div class="abs">Div with Absolute positioning</div>
    </div>
    <div class="fix">Div with Fixed positioning</div>
    <h2>opacity</h2>
    <h3>Opacity</h3>
