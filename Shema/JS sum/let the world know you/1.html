<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    body {
        font-family: 'Baloo Tamma 2', cursive;
        background-color: lightgray;
    }

    /* Social Media Section */
    .social-section {
        background: linear-gradient(135deg,
                chocolate,
                gray
            );
        padding: 80px 0;
    }

    /* Social Media Cards */
    .social-card {
        background-color: #212529;
        /* Dark Charcoal */
        border-radius: 12px;
        padding: 25px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
    }

    /* Hover Animation */
    .social-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        /* Black Shadow */
    }

    /* Social Icons */
    .social-icon {
        font-size: 2.2rem;
    }

    /* Footer */
    footer {
        background-color: #212529;
        /* Dark Charcoal */
    }
</style>
</head>

<body>
    <section class="social-section text-white text-center">
        <div class="container">
            <h2 class="text-warning fw-bold mb-3">Social Media</h2>
            <p class="lead mb-5">Let's connect and grow</p>
            <div class="row g-4">
                <div class="col-sm-6 col-lg-3">
                    <div class="social-card d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">LinkedIn</h5>
                        <i class="fab fa-linkedin social-icon text-warning"></i>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="social-card d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Youtube</h5>
                        <i class="fab fa-youtube social-icon text-danger"></i>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="social-card d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Email</h5>
                        <i class="fab fa-envelope social-icon text-warning"></i>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="social-card d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">X(twitter)</h5>
                        <i class="fab fa-twitter social-icon text-warning"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="text-light text-center py-4">
        <div class="container">
            <p class="mb-1">
                &copy;2026 All rights reserved
            </p>
            <a href="#about" class="text-warning tex-decoration-none">About</a>
        </div>
    </footer>
</body>
</html>
