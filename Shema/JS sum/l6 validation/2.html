<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Enter a number and click OK</p>
    <input type="number" min="100" max="500" id="i" required>
    <button onclick="MyF()">OK</button>
    <p>If the number is less than 100 or greater than 500, an error message 
        will show
    </p>
    <p id="re"></p>
    <script>
        function MyF(){
            var inp = document.getElementById("i")
            if (!inp.checkValidity()){
                document.getElementById("re").innerHTML=inp.validationMessage
            }else{
                document.getElementById("re").innerHTML="Input is OK"

            }
        }
    </script>
</body>
</html>
