<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Click the button to get time based greetings</p>
    <button onclick="timeb()">Click here</button>
    <p id="h"></p>
    <p id="g"></p>
    <h1>While loop</h1>
    <p id="w"></p>
    <script>
        function timeb(){
            var greetings
            var time = new Date().getHours()
            if(time<10){
                greetings="Good morning"
            }
            else if(time<20){
                greetings = "Good day"
            }
            else{
                greetings="Good Evening"
            }
            document.getElementById("h").innerHTML="Current Hour is "+time
            document.getElementById("g").innerHTML=greetings
        }
        var text = ""
        var i=0
        while(i<=10){
            text += "<br>The number is " +i
            i++
        }
        document.getElementById("w").innerHTML=text
    </script>
</body>
</html>
