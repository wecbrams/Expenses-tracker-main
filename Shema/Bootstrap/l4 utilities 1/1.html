<html>
    <head>
        <title>Utilities 1</title>
           <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
      
    </head>
    <body>
        <!-- jumbotron -->
        <div class="jumbotron text-center bg-dark text-white">
            <div class="container">
                <h1 class="display-4 text-warning">Codingal</h1>
                <p class="lead">Codingal will help you fall in love coding</p>

            </div>
        </div>
        <!-- Buttons  -->
         <div class="container text-center">
            <h1>Buttons</h1>
            <button class="btn btn-primary m-1">Primary</button>
            <button class="btn btn-secondary m-1">secondary</button>
            <button class="btn btn-info m-1">Info</button>
            <button class="btn btn-success m-1">Success</button>
            <button class="btn btn-warning m-1">Warning</button>
            <button class="btn btn-danger m-1">Danger</button>
            <button class="btn btn-dark m-1">Dark</button>
            <button class="btn btn-light m-1">Light</button>

         </div>
         <!-- Badges -->
          <div class="container text-center mb-5">
            <h1 class="mb-3">Contextual Badges</h1>
            <span class="badge badge-primary m1">primary</span>
            <span class="badge badge-secondary m1">secondary</span>
            <span class="badge badge-info m1">info</span>
            <span class="badge badge-danger m1">danger</span>
            <span class="badge badge-light m1">light</span>
            <span class="badge badge-dark m1">dark</span>
          </div>

          <!-- progress bar  -->
           <div class="container mb-5">
            <h1 class="text-center mb-3">Learning Progress</h1>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                style="width:70%">
                    70%
                </div>
            </div>
           </div>
    </body>
</html>
