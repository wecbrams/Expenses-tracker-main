<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>Basic Methods</h1>
     <h3>Js Loops</h3>
     
    <script>
        var str = "AmaZinG"
        document.write(str.toLowerCase() +"<br>")
        document.write(str.toUpperCase() +"<br>")
        document.write(str.startsWith("i") +"<br>")
        document.write(Math.random() +"<br>")
        document.write(Math.floor(8.9) +"<br>")

        // Loops
        var fruits=["apple",'grapes','mango','grapes']
        var txt=""
        var i 
        for(i=1;i<fruits.length;i++){
            txt+=fruits[i]+"<br>"
        }
        document.write(txt +"<br>")

    </script>
</body>
</html>
