<html>
    <head>
    <title>Intro to functions</title>
</head>
<body>
    <button onclick="mF(5)">Execute JS function</button>
    <p id="i"></p>
    <h3>A function to access variables</h3>
    
    <button onclick="calc()">calculate</button>
    <p id="d"></p>
    <p id="d1"></p>

    <h1 style="color:lime">Function declaration</h1>
    <p id="r"></p>
    <script>
        function mF(x,y){
            if (y==undefined){
                y=6
            }
            document.getElementById("i").innerHTML=x*y
        }
        
        // Scope of variables
        var b = 5  //global
        function calc(){
            var a = 7 //local
            document.getElementById("d").innerHTML=a*b
        }
        document.getElementById("d1").innerHTML=b

        // Expression of a variable 
        var resuslt= function(a,b){return a*b}
        document.getElementById("r").innerHTML=resuslt(5,7)
    </script>
</body>
</html>
