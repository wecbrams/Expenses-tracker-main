<html>
    <head>
        <title>Intro to bootstrap</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
        <style>
            .col{
                border: 2px solid blue;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Grids in bootstrap</h1>
        <div class="container">
            <div class="row">
                <div class="col">Column 1</div>
                <div class="col">Column 2</div>
                <div class="col">Column 3</div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-md-8 col-xs-4" style="border: 2px solid yellow;">Extra small</div>
                <div class="col-md-12 col-lg-8" style="border: 2px solid blue">Extra</div>
            </div>
            <div class="row">
                <div class="col-6">1st Half grid</div>
                <div class="col-6">2st Half grid</div>
            </div>
            <div class="row">
                <div class="col-lg-4" style="border: 2px dotted blue;">dummy</div>
                <div class="col-lg-8" style="border: 2px dotted red;">dummy</div>
            </div>
        </div>
    </body>
</html>
