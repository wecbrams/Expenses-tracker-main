<html>
    <head>
        <title>My coding journey</title>
        <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Bootstrap JS -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </head>
    <body>
        <!-- jumbotron -->
         <div class="jumbotron bg-dark text-white">
            <div class="container">
                <h1 class="display-1">Welcome to my coding Journey</h1>
                <p class="lead">Learn. Code. Grow</p>
            </div>
         </div>

         <!-- Buttons -->
          <div class="container">
            <button class="btn btn-primary m-1">Excited</button>
            <button class="btn btn-success m-1">Confident</button>
            <button class="btn btn-warning m-1">Curious</button>
            <button class="btn btn-danger m-1">Challenged</button>
            <button class="btn btn-info m-1">Victorous</button>
            <button class="btn btn-secondary m-1">Determined</button>
          </div>

          <!-- Badges -->
           <div class="container">
            <h2>Your achievements</h2>
            <span class="badge badge-success">html beginner</span>
            <span class="badge badge-info">CSS Explorer</span>
            <span class="badge badge-warning">Bootstrap Learner</span>
            <span class="badge badge-danger">Javascript adventure</span>

           </div>

           <!-- Progress Bar Section  -->
            <div class="container">
                <h2>Learning progress</h2>
                <div class="progress" style="height: 25px;">
                    <div class="progress-bar bg-success" style="width: 70%;">70% Complete</div>
                </div>
                <p class="text-muted">Keep going, You are almost there!</p>
            </div>

    </body>
</html>
