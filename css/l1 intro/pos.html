<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        #fix{
            position: fixed;
            top: 0;
            right: 20px;
            width: 300px;
            border: 3px solid #73AD21;
    
        }
        #rel{
            position: relative;
            left:200px;
            border: 3px solid lime;
        }
        #absol{
            position: absolute;
            left:200px;
            border: 3px solid lime;
        }
        #sticky{
            position: sticky;
        top: 10px;
        left: 20px;
        width:100px;
        border: 3px solid #73AD21;
        }
        h1{
            opacity: 30%;
        }
    </style>
</head>
<body>
    <h1>Positions</h1>
    <div id="st">Static</div>
    <div id="fix">Fixed</div>
    <div id="rel">Relative</div>
    <div id="absol">Absolute</div>
    <div id="sticky">Sticky</div>
