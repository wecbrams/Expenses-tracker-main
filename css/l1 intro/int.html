<html>
<head>
    <title>Intro to css</title>
    <style>
        /* Element selector */
        h2{
            color:brown;
        }
        p{
            color:lime;
        }
        /* Id Selector */
        #h{
            color:red;
        }
        #hi{
            color: aqua;
        }
        /* Class */
        .sean{
            background-color: yellow;
        }

        *{
            background-color: lime;
        }

        h1, #h, h3, .sean{
            text-align: center;
        }


    </style>

    <link rel="stylesheet" href="int.css">
</head>
<body>
    <p id="h">HEllo</p>
    <p id="hi">HEllo 2</p>

    <h1 style="color:blue;">Inline </h1>
    <h2 class="sean">Internal</h2>
    <h3 >External</h3>
</body>
</html>
