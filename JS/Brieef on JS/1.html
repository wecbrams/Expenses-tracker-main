<html>
<head>
    <title>Data Types</title>
</head>
<body>
    <h1>Data Types</h1>
    <script>
        var a= 8
        var b = 10
        var c = 10
        var d =null
        var e
        document.write("a and b are equal : "+(a==b)+"<br>")
        document.write("b and c are equal : "+(b==c)+"<br>")
        document.write(" the value of d is : "+d+"<br>")
        document.write(" the value of e is : "+e+"<br>")

        // while loop
        var text =""
        var i = 0
        while (i<=10){
            text += "The number is "+i+"<br>"
            i++
        }
        document.write(text)
    </script>
</body>
</html>
