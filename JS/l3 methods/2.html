<!DOCTYPE html>
<html lang="en">
<head>
     <title>The loop</title>
</head>
<body>
    <h1>JS for loop</h1>
    <script>
        var fruits=["Apples", "MAngo","Grapes","Watermelon"];
        var text=""
        var i
        for (i=0; i<fruits.length; i++){
            text+=fruits[i] +"<br>"
        }
        document.write(text)
    </script>
</body>
</html>
