<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social media</title>
      <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="social media.css">
</head>
<body>
    <section class="social-section text-white text-center">
        <div class="container">
            <h2 class="text-warning fw-bold mb-3">Social Media</h2>
            <p class="text-warning fw-bold mb-3">Let's connect and grow</p>
            <div class="row g-4">
                <div class="col-sm-6 col-lg-3">
                    <a href="" class="social-link" target="_blank">
                        <div class="social-card d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">LinkedIn</h5>
                            <i class="fab fa-linkedin social-icon text-primary"></i>
                        </div>
                    </a>
                </div>

                <div class="col-sm-6 col-lg-3">
                    <a href="" class="social-link" target="_blank">
                        <div class="social-card d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">YouTube</h5>
                            <i class="fab fa-youtube social-icon text-danger"></i>
                        </div>
                    </a>
                </div>

                <div class="col-sm-6 col-lg-3">
                    <a href="" class="social-link" target="_blank">
                        <div class="social-card d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Email</h5>
                            <i class="fas fa-envelope social-icon"></i>
                        </div>
                    </a>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <a href="" class="social-link" target="_blank">
                        <div class="social-card d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Twitter</h5>
                            <i class="fab fa-twitter social-icon text-info"></i>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>
    <footer class="text-light text-center py-4">
        <div class="container">
            <p class="mb-1">@copy; 2026 W4Trust. All Rights Reserved.</p>
            <a href="About" class="text-warning text-decoration-none">About</a>
        </div>
    </footer>
</body>
</html>
