<!DOCTYPE html>
<html lang="en">
<head>
     <title>Intro functions</title>
</head>
<body>
    <button onclick="myf(5,4)">Click me</button>

    <script>
        function myf(x,y){
            if (y==undefined){
                y=2
            }
            document.write(x*y)
        }
    </script>

</body>
</html>
